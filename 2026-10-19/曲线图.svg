<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650">
  <rect width="1080" height="650" fill="#f7f5f0"/>
  <text x="70" y="62" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172554">10月9日—16日：主要指数收盘走势</text>
  <text x="70" y="98" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#64748b">指数按各自10月9日收盘归一化为100；美股10月12—16日为公开收盘点位</text>
  <g stroke="#d7d3cc" stroke-width="1">
    <line x1="100" y1="160" x2="1010" y2="160"/><line x1="100" y1="250" x2="1010" y2="250"/>
    <line x1="100" y1="340" x2="1010" y2="340"/><line x1="100" y1="430" x2="1010" y2="430"/>
    <line x1="100" y1="520" x2="1010" y2="520"/>
  </g>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#64748b">
    <text x="45" y="166">102</text><text x="45" y="256">101</text><text x="45" y="346">100</text><text x="45" y="436">99</text><text x="45" y="526">98</text>
    <text x="94" y="560">10/9</text><text x="275" y="560">10/12</text><text x="456" y="560">10/14</text><text x="637" y="560">10/15</text><text x="818" y="560">10/16</text>
  </g>
  <line x1="100" y1="520" x2="1010" y2="520" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="160" x2="100" y2="520" stroke="#475569" stroke-width="2"/>
  <!-- S&P 500: 100, 99.83, gap-normalized 98.70, 99.02, 97.93 -->
  <polyline points="110,340 291,355 472,457 653,428 834,527" fill="none" stroke="#d97706" stroke-width="5"/>
  <!-- Nasdaq: 100, 99.56, gap-normalized 97.43, 97.50, 95.41 -->
  <polyline points="110,340 291,380 472,572 653,566 834,527" fill="none" stroke="#2563eb" stroke-width="5"/>
  <!-- Shanghai: 100 at 10/9, 97.44 at 10/16 -->
  <polyline points="110,340 291,340 472,340 653,340 834,571" fill="none" stroke="#059669" stroke-width="5" stroke-dasharray="10 8"/>
  <g fill="#d97706"><circle cx="110" cy="340" r="6"/><circle cx="291" cy="355" r="6"/><circle cx="472" cy="457" r="6"/><circle cx="653" cy="428" r="6"/><circle cx="834" cy="527" r="6"/></g>
  <g fill="#2563eb"><circle cx="110" cy="340" r="6"/><circle cx="291" cy="380" r="6"/><circle cx="472" cy="572" r="6"/><circle cx="653" cy="566" r="6"/><circle cx="834" cy="527" r="6"/></g>
  <g fill="#059669"><circle cx="110" cy="340" r="6"/><circle cx="834" cy="571" r="6"/></g>
  <g font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#334155">
    <rect x="120" y="595" width="18" height="5" fill="#d97706"/><text x="148" y="602">标普500</text>
    <rect x="280" y="595" width="18" height="5" fill="#2563eb"/><text x="308" y="602">纳斯达克</text>
    <rect x="450" y="595" width="18" height="5" fill="#059669"/><text x="478" y="602">上证指数</text>
  </g>
  <text x="70" y="632" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#94a3b8">注：10/13收盘点位未在图中单独标注；上证指数以10/9与10/16公开收盘点位连接，虚线表示中间不作日度推断。</text>
</svg>
